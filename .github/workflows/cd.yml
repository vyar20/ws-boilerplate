name: CD

# Continuous delivery: build a production Docker image and publish it to the
# GitHub Container Registry (ghcr.io). Deploying that image to a specific host
# (VPS, Fly.io, Cloud Run, etc.) is the last mile — wire it in once you pick one.
on:
  push:
    branches: [main, master]
    tags: ['v*']

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build & push image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # VITE_BACKEND_URL is baked into the frontend bundle at build time.
          # Set a repository variable of the same name to point at your domain.
          build-args: |
            VITE_BACKEND_URL=${{ vars.VITE_BACKEND_URL || 'http://localhost:3000' }}
