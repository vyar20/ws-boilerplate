name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Prisma generation and the frontend build read env vars; the committed
      # examples provide safe, non-secret defaults for CI.
      - name: Prepare env files
        run: |
          cp apps/backend/.env.example apps/backend/.env
          cp apps/frontend/.env.example apps/frontend/.env

      - name: Generate Prisma client
        run: bun run db:gen

      - name: Lint (enforces the client/server boundary)
        working-directory: apps/frontend
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  # Auto-deploy: only runs after CI passes, and only on pushes to master
  # (i.e. when a PR is merged) — never on pull requests.
  deploy:
    name: Deploy to VPS
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Pull, build & restart on the VPS (SSH)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_PATH }}"
            git pull --ff-only origin master
            bash scripts/deploy.sh
