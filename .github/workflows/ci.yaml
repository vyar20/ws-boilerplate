name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  ci:
    name: linting - test - typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Create dummy env for codegen
        run: |
          cat > apps/backend/.env <<'EOF'
          NODE_ENV=development
          PORT=3000
          DATABASE_URL=postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET=ci-dummy-better-auth-secret-000000000000
          BETTER_AUTH_URL=http://localhost:3000
          ENCRYPTION_KEY=ci-dummy-encryption-key-00000000000000000
          EOF

      - name: Make logs dir
        run: mkdir logs

      - name: Generate Prisma client
        run: bun run db:gen

      - name: linting
        run: bun run lint

      - name: test
        run: bun run test

      - name: typecheck
        run: bun run typecheck
