name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  ci:
    name: lint - test - typecheck - build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Create dummy env for codegen
        run: |
          cat > apps/backend/.env <<'EOF'
          PORT=3000
          DATABASE_URL=postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET=ci-dummy-better-auth-secret-000000000000
          BETTER_AUTH_URL=http://localhost:3000
          EOF

      - name: Prisma Migration
        run: bun run db:migrate:deploy

      - name: Generate Prisma client
        run: bun run db:gen

      - name: linting
        run: bun run lint

      - name: test
        run: bun run test

      # Real Better Auth + Prisma against the Postgres service migrated above.
      - name: integration test
        run: bun run test:integration

      - name: typecheck
        run: bun run typecheck

      - name: build
        run: bun run build
