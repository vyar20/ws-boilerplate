name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  ci:
    name: linting - test - build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instal deps
        run: bun install --frozen-lockfile

      - name: linting
        run: bun run lint

      - name: build
        run: bun run build
